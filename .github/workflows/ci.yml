name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: cargo +stable fmt --all --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test workspace
        run: cargo +stable test --workspace --all-features

  host-tests:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test workspace
        run: cargo +stable test --workspace --all-features

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check workspace on MSRV
        run: cargo +1.85.0 check --workspace

  fuzz-smoke:
    name: bounded fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUZZ_NIGHTLY: nightly-2026-10-02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install nightly Rust
        run: rustup toolchain install $FUZZ_NIGHTLY --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Build fuzz targets
        run: cargo +$FUZZ_NIGHTLY fuzz build
      - name: Lexer fuzz smoke
        run: cargo +$FUZZ_NIGHTLY fuzz run lexer fuzz/seeds/lexer -- -runs=256
      - name: Parser fuzz smoke
        run: cargo +$FUZZ_NIGHTLY fuzz run parser fuzz/seeds/parser -- -runs=256
      - name: Compile fuzz smoke
        run: cargo +$FUZZ_NIGHTLY fuzz run compile fuzz/seeds/compile -- -runs=128
      - name: Runtime fuzz smoke
        run: cargo +$FUZZ_NIGHTLY fuzz run runtime fuzz/seeds/runtime -- -runs=64
